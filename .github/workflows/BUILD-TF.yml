# 手动编译 Nokia Bell 140G 系列（XG-140G-TF / XG-040G-TF 等）UBI 固件
# 由 WRT-CORE 公用核心完成编译，产出 factory.bin（全量 UBI 镜像）+ sysupgrade.bin
name: BUILD-TF

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行分隔（可留空）'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: AIROHA-TCBOOT
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: AIROHA-TCBOOT
      WRT_THEME: footstrap
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: "12345678"
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/bingoguo93/immortalwrt.git
      WRT_BRANCH: "6.18"
      WRT_SOURCE: bingoguo93/immortalwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_TEST: ${{ inputs.TEST == true }}
