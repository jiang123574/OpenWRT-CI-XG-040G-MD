# 手动编译：AIROHA-ONU 配置（源码 pbs05/ponwrt master）
# 勾选了 nokia_xg-040g-tf-ubi，产出 TF 的 sysupgrade.itb + initramfs-recovery.itb
name: BUILD-ONU

on:
  push:
    tags:
      - 'build-tf'
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行分隔（可留空）'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: false
        type: boolean

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: AIROHA-ONU
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: AIROHA-ONU
      WRT_THEME: argon
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: "12345678"
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/pbs05/ponwrt.git
      WRT_BRANCH: master
      WRT_SOURCE: pbs05/ponwrt
      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_TEST: ${{ inputs.TEST == true }}
